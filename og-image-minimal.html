<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arif Ali OG Image Minimal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #001524;
      --bg-soft: #0b2030;
      --ink: #f8f1e6;
      --muted: #c3b89f;
      --line: rgba(248, 241, 230, 0.14);
      --brand: #4c9df2;
      --accent: #d7b07a;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a1420;
      font-family: Manrope, "Segoe UI", sans-serif;
      color: var(--ink);
    }

    .frame {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(420px 220px at 12% 10%, rgba(76, 157, 242, 0.18), transparent 72%),
        linear-gradient(180deg, var(--bg-soft), var(--bg));
      border: 1px solid rgba(248, 241, 230, 0.08);
    }

    .line {
      position: absolute;
      left: 64px;
      right: 64px;
      top: 118px;
      height: 1px;
      background: linear-gradient(90deg, rgba(248,241,230,0.22), rgba(248,241,230,0));
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .eyebrow {
      font-size: 18px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-family: Fraunces, Georgia, serif;
      font-size: 88px;
      line-height: 0.95;
      letter-spacing: -0.05em;
      font-weight: 600;
    }

    .accent {
      background: linear-gradient(135deg, var(--brand), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      max-width: 720px;
      color: var(--muted);
      font-size: 28px;
      line-height: 1.45;
      font-weight: 500;
    }

    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    .mark {
      color: var(--ink);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .site {
      color: var(--muted);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="line"></div>
    <div class="content">
      <div class="eyebrow">Software Engineer Portfolio</div>

      <section>
        <h1><span class="accent">Arif Ali</span></h1>
        <p class="subtitle">Building practical software across applications, Web Development, and AI/ML.</p>
      </section>

      <div class="bottom">
        <div class="mark">AΛ</div>
        <div class="site">arifali.me</div>
      </div>
    </div>
  </main>
</body>
</html>
